# Optional drop-in for an existing system cloudflared.service, token-managed tunnel only.
# Render <admin-user>; confirm /usr/bin/cloudflared for the installed package.
[Service]
# bwenv remains the supervising parent; do not retain a vendor Type=notify unit.
Type=simple
Restart=on-failure
RestartSec=15
KillMode=control-group
EnvironmentFile=/home/<admin-user>/.config/vps-ops/runtime.env
LoadCredential=bws-token:/home/<admin-user>/.config/vps-ops/bws-token
ExecStart=
ExecStart=/home/<admin-user>/.local/bin/vps-bwenv-exec.py cloudflared /usr/bin/cloudflared tunnel --no-autoupdate run
