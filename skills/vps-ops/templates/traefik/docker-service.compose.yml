services:
  <service-name>:
    image: <image>@sha256:<digest>
    restart: unless-stopped
    expose:
      - "<internal-port>"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.<route-name>.rule=Host(`<hostname>.<project-domain>`)
      - traefik.http.routers.<route-name>.entrypoints=web
      - traefik.http.services.<route-name>.loadbalancer.server.port=<internal-port>
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
